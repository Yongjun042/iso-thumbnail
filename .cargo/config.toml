# Link the C runtime statically so the DLL does not depend on VCRUNTIME140.dll /
# the VC++ redistributable being present on the machine that loads it.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
